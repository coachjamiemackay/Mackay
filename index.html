<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Trainer Apeldoorn | Personal Training by Jamie Mackay</title>
<meta name="description" content="Personal training in Apeldoorn for busy professionals. Evidence-based strength and fat loss coaching with Jamie Mackay. Book your free consultation today.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#3B82F6;
    --accent-hover:#2563EB;
    --ink:#111113;
    --ink-2:#27272A;
    --gray-1:#52525B;
    --gray-2:#6B7280;
    --gray-3:#71717A;
    --gray-4:#A1A1AA;
    --bg:#FAFAF9;
    --dark:#111113;
    --darker:#0B0B0D;
    --card-dark:#1A1A1D;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-hover)}
  img{display:block;max-width:100%}
  ::selection{background:var(--accent);color:#fff}
  button{font-family:inherit}

  .wrap{max-width:1160px;margin:0 auto;padding-left:24px;padding-right:24px}
  .section{padding:96px 24px}
  .section-head{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto;text-align:center}
  .section-head p{margin:0;font-size:16.5px;line-height:1.7;color:var(--gray-1)}
  h2{margin:0;font-size:clamp(30px,4vw,44px);line-height:1.1;letter-spacing:-0.03em;font-weight:800}

  .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;padding:16px 32px;border-radius:14px;font-weight:700;font-size:16px;box-shadow:0 8px 24px rgba(59,130,246,0.3);border:0;cursor:pointer;transition:background .15s ease}
  .btn:hover{background:var(--accent-hover);color:#fff}
  .btn-lg{padding:18px 40px;font-size:17px;box-shadow:0 8px 28px rgba(59,130,246,0.35)}
  .btn-sm{padding:10px 20px;font-size:14px;box-shadow:none}
  .btn-card{padding:15px 32px;font-size:15px;box-shadow:0 8px 24px rgba(59,130,246,0.35)}

  /* NAV */
  header.nav{position:sticky;top:0;z-index:50;background:rgba(250,250,249,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(17,17,19,0.07)}
  nav.nav-row{max-width:1160px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:16px;letter-spacing:-0.02em}
  .logo-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800}
  .logo-sub{font-weight:500;color:var(--gray-2)}
  .nav-right{display:flex;align-items:center;gap:16px;font-size:14px;font-weight:500}
  .lang-toggle{display:flex;align-items:center;border:1px solid rgba(17,17,19,0.14);border-radius:999px;padding:3px;gap:2px}
  .lang-btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:0.02em;padding:5px 12px;border-radius:999px;color:var(--gray-2);background:transparent}
  .lang-btn.active{background:var(--ink);color:#fff}

  /* HERO */
  .hero{max-width:1160px;margin:0 auto;padding:88px 24px 96px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center}
  .hero-copy{display:flex;flex-direction:column;gap:28px}
  .hero-copy h1{margin:0;font-size:clamp(40px,6vw,68px);line-height:1.02;letter-spacing:-0.035em;font-weight:800}
  .hero-copy p{margin:0;font-size:19px;line-height:1.6;color:var(--gray-1);max-width:480px}
  .hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
  .hero-photo{border-radius:24px;overflow:hidden;aspect-ratio:4/5;border:1px solid rgba(17,17,19,0.08)}
  .hero-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 50%}

  /* DARK SECTION generic */
  .section-dark{background:var(--dark);color:#fff}

  /* PAIN */
  .pain-body{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px;text-align:center}
  .pain-body p{margin:0;font-size:17px;line-height:1.75;color:var(--gray-4)}
  .pain-body p.strong{color:#fff;font-weight:600}

  /* SOCIAL PROOF */
  .proof-section{background:#fff;border-top:1px solid rgba(17,17,19,0.07)}
  .proof-inner{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:56px}
  .proof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .proof-grid img{width:100%;aspect-ratio:1080/925;object-fit:cover;border-radius:18px}
  .proof-grid img.peer{object-position:50% 0%}
  .reviews-embed{border-radius:18px;border:1px dashed rgba(17,17,19,0.2);background:repeating-linear-gradient(-45deg,#FAFAF9,#FAFAF9 12px,#F2F2F0 12px,#F2F2F0 24px);min-height:180px;display:grid;place-items:center;padding:32px}
  .reviews-embed span{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gray-2);background:#fff;padding:8px 14px;border-radius:8px;border:1px solid rgba(17,17,19,0.08)}
  .proof-cta{align-self:center}

  /* BENEFITS */
  .benefits-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  .benefit-card{background:var(--card-dark);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:32px 28px;display:flex;flex-direction:column;gap:14px}
  .benefit-num{width:40px;height:40px;border-radius:12px;background:rgba(59,130,246,0.15);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:15px}
  .benefit-card h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-0.01em}
  .benefit-card p{margin:0;font-size:15px;line-height:1.6;color:var(--gray-4)}

  /* HOW IT WORKS */
  .how-section{background:#fff;border-top:1px solid rgba(17,17,19,0.07);border-bottom:1px solid rgba(17,17,19,0.07)}
  .how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
  .step-card{display:flex;flex-direction:column;gap:16px;padding:32px 28px;border-radius:20px;background:var(--bg);border:1px solid rgba(17,17,19,0.07)}
  .step-num{font-size:44px;font-weight:800;letter-spacing:-0.04em;color:var(--accent)}
  .step-card h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em}
  .step-card p{margin:0;font-size:15px;line-height:1.6;color:var(--gray-1)}
  .how-cta{align-self:center}

  /* ABOUT */
  .about-grid{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:start}
  .about-photo img{width:100%;height:auto;border-radius:20px}
  .about-copy{display:flex;flex-direction:column;gap:20px}
  .about-body{margin:0;font-size:16.5px;line-height:1.7;color:var(--gray-4)}
  .about-body div{margin-bottom:1.7em}
  .about-body div:last-child{margin-bottom:0}

  /* PRICING */
  .pricing-section{max-width:1160px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:52px}
  .pricing-cards{display:flex;flex-direction:column;gap:28px}
  .pricing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;max-width:860px;width:100%;margin:0 auto}
  .price-card{background:#fff;border:1px solid rgba(17,17,19,0.08);border-radius:24px;padding:40px 32px;display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 3px rgba(17,17,19,0.04);transition:box-shadow .15s ease}
  .price-card:hover{box-shadow:0 8px 28px rgba(17,17,19,0.09)}
  .price-head{display:flex;flex-direction:column;gap:8px}
  .price-head h4{margin:0;font-size:26px;font-weight:800;letter-spacing:-0.02em}
  .price-sub{font-size:16px;font-weight:500;color:var(--gray-2);line-height:1.4}
  .price-desc{margin:0;font-size:15px;line-height:1.65;color:var(--gray-1)}
  .includes-label{font-size:13px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--gray-2)}
  .includes-list{display:flex;flex-direction:column;gap:16px;color:var(--ink-2)}
  .includes-item{display:flex;gap:12px}
  .includes-item .check{color:var(--accent);font-weight:700;margin-top:1px}
  .includes-item strong{font-size:15px;letter-spacing:-0.01em;color:var(--ink)}
  .price-disclaimer{margin:0;font-size:13px;line-height:1.6;color:var(--gray-1);font-style:italic}
  .price-row{display:flex;align-items:baseline;gap:10px}
  .price-amount{font-size:44px;font-weight:800;letter-spacing:-0.03em}
  .price-per{font-size:14px;color:var(--gray-2);font-weight:500}
  .guarantee{display:flex;align-items:flex-start;gap:12px;padding:16px 18px;border-radius:14px;background:rgba(59,130,246,0.07);border:1px solid rgba(59,130,246,0.25)}
  .guarantee svg{flex:none;color:var(--accent);margin-top:1px}
  .guarantee strong{font-size:15px;letter-spacing:-0.01em;color:var(--ink)}
  .guarantee span.desc{font-size:14px;line-height:1.55;color:var(--gray-1)}
  .price-cta{align-self:center;margin-top:auto;text-align:center}

  /* WHY */
  .why-grid{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:start}
  .why-list{display:flex;flex-direction:column;gap:0}
  .why-item{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid rgba(255,255,255,0.12)}
  .why-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
  .why-item strong{font-size:16.5px;letter-spacing:-0.01em}
  .why-item span.desc{font-size:14.5px;line-height:1.6;color:var(--gray-4)}

  /* FAQ */
  .faq-section{background:#fff;border-top:1px solid rgba(17,17,19,0.07)}
  .faq-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
  .faq-list{display:flex;flex-direction:column;gap:12px}
  .faq-item{border:1px solid rgba(17,17,19,0.09);border-radius:16px;background:var(--bg);overflow:hidden}
  .faq-q{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:20px 24px;font-family:'Archivo',sans-serif;font-size:16.5px;font-weight:600;color:var(--ink)}
  .faq-mark{font-size:20px;color:var(--gray-2);flex:none;font-weight:400}
  .faq-a{margin:0;padding:0 24px 22px;font-size:15px;line-height:1.7;color:var(--gray-1)}

  /* FINAL CTA */
  .final-section{padding:110px 24px}
  .final-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px}
  .final-inner h2{font-size:clamp(32px,5vw,54px);line-height:1.06;letter-spacing:-0.035em}
  .final-inner p{margin:0;font-size:17px;line-height:1.7;color:var(--gray-4);max-width:520px}
  .scarcity{margin:0;font-size:13.5px;color:var(--gray-3);font-family:'IBM Plex Mono',monospace}

  /* FOOTER */
  footer{background:var(--darker);color:var(--gray-4);padding:56px 24px}
  .footer-inner{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
  .footer-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px}
  .footer-brand{display:flex;flex-direction:column;gap:10px;max-width:280px}
  .footer-brand .logo-row{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:15px}
  .footer-brand .logo-mark{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--ink);font-size:12px}
  .footer-brand .tag{font-size:14px;line-height:1.6}
  .footer-col{display:flex;flex-direction:column;gap:10px;font-size:14px}
  .footer-col .col-label{color:#fff;font-weight:700;font-size:13px;letter-spacing:0.06em;text-transform:uppercase}
  .footer-col a{color:var(--gray-4)}
  .footer-col a:hover{color:#fff}
  .footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--gray-3)}

  /* WHATSAPP */
  .whatsapp-btn{position:fixed;bottom:24px;right:24px;z-index:60;width:56px;height:56px;border-radius:999px;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(17,17,19,0.28);transition:transform 0.15s ease}
  .whatsapp-btn:hover{transform:scale(1.08)}

  @media (max-width:640px){
    .section{padding:72px 20px}
    .final-section{padding:88px 20px}
  }
</style>
</head>
